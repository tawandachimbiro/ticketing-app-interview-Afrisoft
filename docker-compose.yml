services:
  # MariaDB Database
  mariadb:
    image: mariadb:11.2
    container_name: ticketing_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-Amill2017}
      MYSQL_DATABASE: ${DB_NAME:-ticketing_app}
      MYSQL_USER: ${DB_USER:-ticketing_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Amill2017}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot Application
  ticketing-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-ticketing_app}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-ticketing_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Amill2017}
      
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:-sxwj8RC6QZwmtwpHdHQ6nebcWqunsmY1H8q6sO02lNTfsuQOLeHcJmGir/A5Ll3SYon9YS6zfSOpBDcIyBQy1w==}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      
      # Mail Configuration
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-chimbirotawanda@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-hvzv ahom fius lchj}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: false
      
      # Payment Configuration
      PAYMENT_TEST_MODE: ${PAYMENT_TEST_MODE:-true}
      MOTAPA_API_BASE_URL: ${MOTAPA_API_BASE_URL:-https://api.motapa.africa/v1}
      MOTAPA_API_SECRET_KEY: ${MOTAPA_API_SECRET_KEY:-pk_test_DHYQjCldE5EVqib2pHnvLJXhbNC1rBZl}
      
      # Server Configuration
      SERVER_PORT: 8099
      
      # Cache Configuration
      SPRING_CACHE_TYPE: caffeine
    ports:
      - "${APP_PORT:-8099}:8099"
    volumes:
      - qrcodes:/app/qrcodes
    networks:
      - ticketing-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8099/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Optional: phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ticketing_phpmyadmin
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-ticketing_user}
      PMA_PASSWORD: ${DB_PASSWORD:-Amill2017}
      UPLOAD_LIMIT: 100M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - ticketing-network

  # Loki - log aggregation (optional: use --profile logging to include)
  loki:
    image: grafana/loki:latest
    container_name: ticketing_loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ticketing-network
    profiles:
      - logging

  # Promtail - collect container logs and send to Loki
  promtail:
    image: grafana/promtail:latest
    container_name: ticketing_promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      - ./app/src/main/resources/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ticketing-network
    profiles:
      - logging

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: ticketing_prometheus
    restart: unless-stopped
    depends_on:
      ticketing-app:
        condition: service_healthy
    volumes:
      - ./app/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ticketing-network

  # Grafana - metrics and logs visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ticketing_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3000}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - ticketing-network

networks:
  ticketing-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  qrcodes:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
